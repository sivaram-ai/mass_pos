# Bean validation messages in shop-counter words. ApiExceptionHandler puts the field's label in
# front, so each reads as a sentence: "Name is required", "Email is not a valid email address".
# Constraints that need a specific explanation (GSTIN, CIN, HSN) carry their own message.
# ASCII only: this file is read as ISO-8859-1.
jakarta.validation.constraints.NotBlank.message=is required
jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.NotEmpty.message=needs at least one entry
jakarta.validation.constraints.Size.message=must be at most {max} characters
jakarta.validation.constraints.Email.message=is not a valid email address
jakarta.validation.constraints.Pattern.message=is not in the right format
jakarta.validation.constraints.Positive.message=must be more than zero
jakarta.validation.constraints.PositiveOrZero.message=cannot be negative
jakarta.validation.constraints.Min.message=must be at least {value}
jakarta.validation.constraints.Max.message=must be at most {value}
