spring.application.name=mass-pos
spring.main.banner-mode=off
spring.jmx.enabled=false

# --- Terminal & storage --------------------------------------------------------------------------
# Unique per physical till. Prefixes invoice numbers (T1-2627-00001) and tags audit revisions and
# ledger events with their origin. Max 3 chars: GST Rule 46 caps invoice numbers at 16 chars.
pos.terminal.code=${POS_TERMINAL_CODE:T1}
# What staff call this machine, and the floor or area it stands on.
pos.terminal.name=${POS_TERMINAL_NAME:Counter 1}
pos.terminal.section=${POS_TERMINAL_SECTION:}
# MASTER holds the shop consolidated database; COUNTER bills and syncs to it.
pos.terminal.type=${POS_TERMINAL_TYPE:COUNTER}
# Writable per-user location. The install directory (Program Files / Applications) is read-only.
pos.data-dir=${POS_DATA_DIR:${LOCALAPPDATA:${user.home}}/MassPOS}
# Per-till settings (store identity, printer port, terminal code) live next to the database, so they
# survive upgrades and can be edited with Notepad. Values there override this file.
spring.config.import=optional:file:${pos.data-dir}/pos.properties

# --- Seller (company) identity: set per till in <data-dir>/pos.properties ------------------------
# A commented template is written there on first start. Legal name and address are needed
# before invoices can be issued; anything set must be valid (GSTIN check character, CIN and FSSAI
# formats) or the app refuses to start. Each invoice keeps a copy of these values as issued.
pos.company.legal-name=
pos.company.trade-name=
pos.company.gstin=
# One entry per printed line: pos.company.address[0]=..., pos.company.address[1]=...
pos.company.address=
pos.company.phone=
pos.company.email=
pos.company.website=
pos.company.cin=
pos.company.fssai-license=
# When set, original receipts carry a UPI QR code for the bill amount.
pos.company.upi-vpa=

# --- Receipt text: footer lines printed centred on every receipt ---------------------------------
pos.receipt.footer[0]=Thank you! Visit again

# --- Receipt printer: raw ESC/POS, no OS spooler --------------------------------------------------
# SERIAL: RS-232 or a USB printer's virtual COM port (jSerialComm). TCP: LAN printer raw port.
# FILE: no hardware; each job is written to <data-dir>/printer-out as .bin plus a .txt preview.
pos.printer.type=FILE
pos.printer.serial.port=
pos.printer.serial.baud-rate=9600
pos.printer.serial.flow-control=NONE
pos.printer.tcp.host=
pos.printer.tcp.port=9100
# Font A characters per line: 48 for 80 mm paper, 32 for 58 mm.
pos.printer.columns=48
pos.printer.code-page=PC437
pos.printer.drawer-pin=PIN_2
pos.printer.drawer-pulse=100ms
pos.printer.timeout=5s

# --- HTTP: UI + API, loopback only ---------------------------------------------------------------
# Never bind 0.0.0.0: nothing on the LAN should be able to reach the till's API.
server.address=127.0.0.1
server.port=${POS_PORT:8765}
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2

# --- Embedded SQLite -----------------------------------------------------------------------------
# sqlite-jdbc applies the URL pragmas to every pooled connection:
#   journal_mode=WAL            readers never block the writer; a commit is a sequential WAL append
#   synchronous=FULL            fsync the WAL on every commit (~1 ms on SSD). NORMAL is faster but a
#                               power cut can drop the last commits - not acceptable once a numbered
#                               invoice has been printed and handed to the customer
#   transaction_mode=IMMEDIATE  take the write lock at BEGIN, so concurrent writers queue for up to
#                               busy_timeout instead of failing with SQLITE_BUSY on read->write upgrade
#   foreign_keys=true           SQLite ships with FK enforcement off
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${pos.data-dir}/pos.db?journal_mode=WAL&synchronous=FULL&transaction_mode=IMMEDIATE&foreign_keys=true&busy_timeout=5000&cache_size=-16000&temp_store=MEMORY
# One writer at a time anyway; a small fixed pool of long-lived connections keeps page caches warm.
spring.datasource.hikari.pool-name=sqlite
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate 6 ---------------------------------------------------------------------------
# Hibernate's community SQLiteDialect + inline foreign keys (the stock dialect silently drops them).
spring.jpa.database-platform=com.masspos.common.persistence.PosSqliteDialect
# Phase 1 only. Switch to versioned migrations (Flyway + ddl-auto=validate) before the first real
# install: in SQLite, "update" can add columns but never alter or drop them or their constraints.
spring.jpa.hibernate.ddl-auto=update
# Read the existing schema one table at a time. Grouped (the default) makes sqlite-jdbc build one
# UNION ALL term per column of every table, and SQLite refuses more than 500 terms: past 500 columns
# the app would start once on a new database and never again. RestartOnExistingDatabaseTest guards it.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
spring.jpa.open-in-view=false
# UUIDs as 36-char text: readable in any SQLite browser, maps 1:1 to PostgreSQL uuid on sync.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Envers: MCA Rule 11(g) edit log -------------------------------------------------------------
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
# DELETE revisions keep the full last state, not just the id.
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
# A <column>_mod flag per audited column: which fields each revision changed.
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true
spring.jpa.properties.org.hibernate.envers.modified_flag_suffix=_mod
# Keep the default audit strategy. ValidityAuditStrategy UPDATEs earlier audit rows, which the
# append-only triggers (AuditTrailGuard) reject by design.

# --- Logging: there is no console once packaged ---------------------------------------------------
logging.file.name=${pos.data-dir}/logs/pos.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# --- Sign-in -------------------------------------------------------------------------------------
# PIN of the admin account created on the very first start. Left empty, a random PIN is generated
# and written to the log. Either way it must be changed at the first sign-in. Tokens never expire:
# a cashier stays signed in until Log out is pressed.
pos.auth.initial-admin-pin=

# --- Billing ---------------------------------------------------------------------------------------
# Round the payable amount to whole rupees (section 170 of the CGST Act).
pos.billing.round-invoice-total=true
# Refuse to sell an item the ledger says is out of stock. Off by default: a wrong count must never
# stop a paying customer at the counter.
pos.billing.block-negative-stock=false
