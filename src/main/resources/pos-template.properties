# =============================================================================================
#  GO RockIt - settings for THIS till
#
#  Remove the leading '#' from a line to use it, save, then restart GO RockIt.
#  Anything left commented out keeps its built-in default.
#
#  Use plain English letters, digits and punctuation: this file is read as ISO-8859-1, and
#  receipt printers cannot print the rupee sign anyway - write "Rs." instead. Any other
#  character must be written as a \uXXXX escape.
#
#  If GO RockIt does not start after an edit, a value is invalid: logs\pos.log names it.
# =============================================================================================

# --- This till ------------------------------------------------------------------------------
# Prefix of every invoice number (T1-2627-00001): unique per till, 1-3 characters starting with
# a capital letter. Never change it once this till has issued invoices.
#pos.terminal.code=T1
# What staff call this machine, and the floor or area it stands on. Shown in reports.
#pos.terminal.name=Counter 1
#pos.terminal.section=Ground floor
# MASTER holds the shop consolidated database; COUNTER bills and syncs to it.
#pos.terminal.type=COUNTER

# --- Seller: printed on every tax invoice (GST Rule 46) --------------------------------------
# REQUIRED before bills can be issued: legal-name, address[0]. The GSTIN is optional: a shop
# without one bills without GST (no tax charged, receipt printed as a plain BILL).
# Each invoice keeps a copy of these as they were when it was issued, so later edits never
# change old invoices or their reprints.

# Name exactly as on the GST registration certificate.
#pos.company.legal-name=Mass Retail Private Limited

# Shop name printed in large letters at the top of the receipt (defaults to the legal name).
#pos.company.trade-name=MASS MART

# 15-character GSTIN; leave unset if not registered for GST. Its check character is verified, so a typo stops the app from starting
# instead of reaching a customer's invoice. The first two digits are the seller's state and
# decide CGST + SGST (same state) versus IGST (other state).
#pos.company.gstin=27AAPFU0939F1ZV

# Address of this place of business, one printed line per entry.
#pos.company.address[0]=12 MG Road, Camp
#pos.company.address[1]=Pune, Maharashtra 411001

#pos.company.phone=020-5550100
#pos.company.email=accounts@example.com
#pos.company.website=www.example.com

# Corporate Identity Number (21 characters). A company must print it on its bills
# (Companies Act 2013, section 12). Leave empty for proprietorships and partnerships.
#pos.company.cin=U52100MH2020PTC123456

# FSSAI licence or registration number (14 digits). Required on bills of food businesses.
#pos.company.fssai-license=11521999000123

# UPI ID. When set, every original receipt carries a QR code to pay the exact bill amount.
#pos.company.upi-vpa=massmart@okicici

# --- Receipt footer: one centred line per entry (replaces "Thank you! Visit again") -----------
#pos.receipt.footer[0]=Goods once sold will be exchanged within 7 days
#pos.receipt.footer[1]=Thank you! Visit again

# --- Receipt printer --------------------------------------------------------------------------
# Set the printer on screen: Settings > Printer. It is kept in the database from then on, and
# changing it there takes effect on the next bill. What follows is only what the FIRST start
# copies in, so an installer can set a shop up before anyone signs in; editing it later changes
# nothing.
# SERIAL  = RS-232 printer, or USB printer installed with its virtual COM port driver
# TCP     = network printer (raw port 9100)
# WINDOWS = ordinary printer installed in Windows, printed through its driver. For a shop with
#           no thermal printer: the bill comes out on whatever paper that printer holds. The
#           cash drawer and the paper status do not work, as they live on a thermal printer's
#           own ports.
# FILE    = no printer: receipts are saved in the printer-out folder next to this file
#pos.printer.type=SERIAL
#pos.printer.serial.port=COM3
#pos.printer.serial.baud-rate=9600
# NONE, RTS_CTS or DTR_DSR - must match the printer's self-test page
#pos.printer.serial.flow-control=NONE
#pos.printer.tcp.host=192.168.1.50
#pos.printer.tcp.port=9100
# Copy the name from Settings > Bluetooth & devices > Printers & scanners, exactly as it is
# written there. Leave it empty to use whichever printer Windows marks as the default.
#pos.printer.windows.name=Canon G3080 series
# How wide the bill is printed on the sheet. 80 mm is the width of a receipt roll, so an A4
# page carries a bill of the usual shape with room to spare. Set 0 to use the whole width.
#pos.printer.windows.width-mm=80
# 48 for 80 mm paper, 32 for 58 mm paper
#pos.printer.columns=48
# PC437, PC850, PC858 or WPC1252
#pos.printer.code-page=PC437
# Cash drawer on the printer's DK port: PIN_2 or PIN_5. Lengthen the pulse (max 510ms) if the
# drawer does not open.
#pos.printer.drawer-pin=PIN_2
#pos.printer.drawer-pulse=100ms

# --- Web server -------------------------------------------------------------------------------
#server.port=8765

# --- Sign-in ----------------------------------------------------------------------------------
# PIN for the admin account created on the very first start. Left commented out, it is 0000, which
# the sign-in screen says. Either way it must be changed at the first sign-in before anything else
# can be done, so a known one is no weaker than a random one nobody has typed yet.
#pos.auth.initial-admin-pin=481920

# --- Billing ----------------------------------------------------------------------------------
# Round every bill to whole rupees (section 170 of the CGST Act).
#pos.billing.round-invoice-total=true
# Refuse to sell what the stock ledger says you do not have. Leave off unless your counts are exact.
#pos.billing.block-negative-stock=false

# --- Backups ----------------------------------------------------------------------------------
# The till keeps its copies of the shop outside its own folder, because uninstalling GO RockIt
# deletes the installed folder and everything under it. Two folders are made inside this one:
#   start-stop\  a copy written every time the till opens and closes, oldest deleted past "keep"
#   backups\     a copy taken by hand from Settings > Database, never deleted by the till
# Put a pen drive's letter here and the shop has a copy off the machine as well.
#pos.backup.offsite-dir=D:/GO RockIt backups
# How many of the automatic start-stop copies to keep before the oldest is deleted.
#pos.backup.keep=10
