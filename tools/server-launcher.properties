# The till's server: Spring Boot, no window of its own. jpackage builds it as a second exe beside
# the shortcut's launcher, which starts it when the till is not already running. It deliberately
# gets no Start-menu or desktop shortcut - nobody should have to start it by hand - and it carries
# the JVM tuning that used to sit on the only launcher there was.
#
# main-class is filled in by build-installer.ps1 from the jar's own manifest. It has to be set:
# jpackage gives an added launcher the main application's main class unless its properties name
# one, and the server would then run the desktop launcher, which would start another server.
main-jar=mass-pos.jar
main-class=
java-options=-XX:+UseG1GC -Xms512m -Xmx512m -XX:MaxGCPauseMillis=20 -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+ExitOnOutOfMemoryError
win-console=false
